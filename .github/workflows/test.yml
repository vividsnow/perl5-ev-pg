name: Test
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        perl: ['5.40', '5.38', '5.36', '5.34', '5.32', '5.30', '5.28', '5.26']
        include:
          - os: ubuntu-latest
            perl: '5.22'
          - os: ubuntu-latest
            perl: '5.14'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install PostgreSQL (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"

      - name: Install PostgreSQL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf libpq postgresql@17
          export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          brew services start postgresql@17
          sleep 3
          createuser -s "$USER" || true

      - name: Install deps
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix libpq)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          cpanm -n Alien::libpq EV EV::MakeMaker

      - name: Build and test
        env:
          TEST_PG_CONNINFO: dbname=postgres
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix postgresql@17)/bin:$PATH"
          fi
          perl Makefile.PL
          make
          make test

      - name: Show libpq version
        run: perl -Mblib -MEV::Pg -MAlien::libpq -e 'printf "headers %s, runtime %d\n", Alien::libpq->version, EV::Pg->lib_version'

  test-pg14:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install PostgreSQL 14
        run: |
          sudo apt-get update
          v=$(apt-cache madison libpq-dev | awk '$3 ~ /^14\./ { print $3; exit }')
          test -n "$v"
          sudo apt-get install -y --allow-downgrades postgresql "libpq-dev=$v" "libpq5=$v"
          pg_config --version
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"

      - name: Install deps
        run: cpanm -n Alien::libpq EV EV::MakeMaker

      - name: Build and test against libpq 14
        env:
          TEST_PG_CONNINFO: dbname=postgres
        run: |
          perl Makefile.PL
          make
          perl -Mblib -MEV::Pg -e 'my $v = EV::Pg->lib_version; print "runtime libpq $v\n"; $v < 150000 or die "not libpq 14\n"; EV::Pg->can("cancel_async") and die "libpq 17 method compiled in\n"'
          make test

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
          cpanm -n Alien::libpq EV EV::MakeMaker

      - name: Build dist tarball and smoke-test it
        run: |
          perl Makefile.PL
          make dist
          tarball=$(ls -t EV-Pg-*.tar.gz | head -1)
          echo "tarball: $tarball"
          rm -rf /tmp/distcheck && mkdir -p /tmp/distcheck
          tar -xzf "$tarball" -C /tmp/distcheck
          cd /tmp/distcheck/EV-Pg-*
          perl Makefile.PL
          make
          make install DESTDIR=/tmp/distcheck/root
          perl -Mblib -MEV::Pg -e 'printf "tarball build OK, libpq %d\n", EV::Pg->lib_version'

  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.40'

      - name: Install PostgreSQL and valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev valgrind
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"

      - name: Install deps
        run: cpanm -n Alien::libpq EV EV::MakeMaker

      - name: Build
        run: |
          perl Makefile.PL
          make

      - name: Run leak suite under valgrind
        env:
          TEST_PG_CONNINFO: dbname=postgres
          EV_PG_VALGRIND: 1
        run: prove -bv xt/valgrind.t

  test-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          apk add --no-cache perl perl-dev make gcc musl-dev wget \
            postgresql postgresql-dev postgresql-client perl-ev
          wget -qO- https://cpanmin.us | perl - App::cpanminus
          cpanm -n Alien::libpq EV::MakeMaker

      - name: Start PostgreSQL
        run: |
          mkdir -p /run/postgresql /var/lib/postgresql/data
          chown postgres:postgres /run/postgresql /var/lib/postgresql/data
          su postgres -c "initdb -D /var/lib/postgresql/data"
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -l /var/lib/postgresql/logfile start"
          sleep 2
          su postgres -c "createuser -s root"

      - name: Build and test
        env:
          TEST_PG_CONNINFO: dbname=postgres
        run: |
          perl Makefile.PL
          make
          make test

  test-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y perl5 gmake pkgconf postgresql17-server postgresql17-client p5-EV
            pkg install -y p5-App-cpanminus p5-Alien-Build p5-Net-SSLeay p5-IO-Socket-SSL p5-Mozilla-CA
            cpanm -n Alien::libpq EV::MakeMaker
            sysrc postgresql_enable=YES
            /usr/local/etc/rc.d/postgresql initdb
            /usr/local/etc/rc.d/postgresql start
            sleep 2
            su -l postgres -c "createuser -s root"
          run: |
            perl Makefile.PL
            gmake
            TEST_PG_CONNINFO=dbname=postgres gmake test

  test-openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: |
            # OpenBSD 7.9's default SysV semaphore caps (semmns=60) are too low
            # even for initdb's bootstrap backend ("could not create semaphores"),
            # so raise them BEFORE initdb and the postmaster start.  Print the
            # effective values for diagnosis.
            sysctl kern.seminfo.semmni=256 kern.seminfo.semmns=4096 kern.seminfo.semmnu=256 || true
            sysctl kern.seminfo.semmni kern.seminfo.semmns
            pkg_add postgresql-server postgresql-client p5-EV
            pkg_add curl
            curl -L https://cpanmin.us | perl - App::cpanminus
            cpanm -n Alien::libpq EV::MakeMaker
            mkdir -p /var/postgresql/data
            chown _postgresql:_postgresql /var/postgresql/data
            su -l _postgresql -c "initdb -D /var/postgresql/data"
            su -l _postgresql -c "pg_ctl -D /var/postgresql/data -l /var/postgresql/logfile start"
            sleep 2
            su -l _postgresql -c "createuser -s root"
          run: |
            perl Makefile.PL
            make
            TEST_PG_CONNINFO=dbname=postgres make test
